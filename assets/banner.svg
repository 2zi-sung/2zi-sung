<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <circle cx="820" cy="50" r="190" fill="url(#glow2)">
      <animate attributeName="cx" values="820;780;820" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="230" r="170" fill="url(#glow1)">
      <animate attributeName="cx" values="130;190;130" dur="11s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07">
      <circle cx="860" cy="130" r="60"/><circle cx="860" cy="130" r="100"/><circle cx="860" cy="130" r="140"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.55">
      <circle cx="700" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="200" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="210" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="60" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <text x="70" y="82" font-family="Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc" fill-opacity="0.9">&lt;hello world /&gt;</text>
    <text x="70" y="150" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="1">Jisung Lee</text>
    <rect x="72" y="168" width="150" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="212" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">AI Developer  ·  Python  ·  LLM &amp; NLP</text>
  </g>
</svg>
